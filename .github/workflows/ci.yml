name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan every commit
        run: ./gitleaks git . --redact --verbose --exit-code 1

  rules-tests:
    name: Firestore + Storage rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache emulator binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci
      - name: Run rules tests on the emulators
        run: npm test
      - name: Seed script works against the emulators
        run: npm run seed:check

  ios-build:
    name: iOS build (Simulator, Debug)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: xcodebuild -version && xcrun simctl list runtimes | grep -i ios || true
      - name: Link Info.plist where the project expects it
        # INFOPLIST_FILE points at the project root; the real file lives in the
        # app folder and is symlinked locally (see docs/known-issues.md).
        run: ln -s "Fleet Maintenance Tracker/Fleet-Maintenance-Tracker-Info.plist" Fleet-Maintenance-Tracker-Info.plist
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('**/Package.resolved') }}
      - name: Build
        # No GoogleService-Info.plist is needed to compile; it is read at launch.
        run: |
          set -o pipefail
          xcodebuild build \
            -project "Fleet Maintenance Tracker.xcodeproj" \
            -scheme "Fleet Maintenance Tracker" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
